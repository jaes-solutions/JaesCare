<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="JAES Care is secure care management software for supported living, domiciliary care and nursing agencies. Manage staff, shifts, HR, check-ins, handovers and compliance in one platform."
    />

    <meta
      name="robots"
      content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
    />

    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#03060b"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="canonical" href="https://care.jaessolutions.com/" />

    <title>JAES Care | Care Management Software for Care Providers</title>
    <script>
      (() => {
        const theme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = theme === "dark" || (!theme && prefersDark);

        document.documentElement.style.backgroundColor = isDark
          ? "#03060b"
          : "#ffffff";
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
